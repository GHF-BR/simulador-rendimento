<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ganho Garantido Pro</title>
    
    <!-- Fonte Inter (Padrão de interfaces modernas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js corrigido via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            /* Paleta Fintech Dark Mode */
            --bg-color: #121214;
            --surface-color: #202024;
            --surface-hover: #29292e;
            --primary: #820ad1; /* Roxo Nubank */
            --primary-hover: #9c27b0;
            --success: #04d361; /* Verde Neon */
            --text-main: #e1e1e6;
            --text-muted: #a8a8b3;
            --border-color: #323238;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            max-width: 1000px;
            width: 100%;
            align-content: start;
        }

        @media (min-width: 768px) {
            .dashboard-container {
                grid-template-columns: 350px 1fr;
            }
        }

        .card {
            background: var(--surface-color);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .header-title {
            grid-column: 1 / -1;
            margin-bottom: 10px;
        }

        .header-title h1 {
            font-size: 28px;
            margin: 0 0 8px 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title p {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-main);
        }

        /* Inputs estilizados */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 14px 14px 14px 40px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input.no-prefix {
            padding-left: 14px;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(130, 10, 209, 0.2);
            outline: none;
        }

        /* Botões de atalho */
        .years-presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-preset {
            background-color: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-preset:hover {
            background-color: var(--surface-hover);
        }

        .btn-preset.active {
            background-color: rgba(130, 10, 209, 0.15);
            color: var(--primary);
            border-color: var(--primary);
        }

        button.btn-main {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        button.btn-main:hover {
            background-color: var(--primary-hover);
        }

        button.btn-main:active {
            transform: scale(0.98);
        }

        /* Resumo Financeiro */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .result-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
        }

        .result-box.highlight {
            background: linear-gradient(145deg, var(--surface-color), #1a1a1e);
            border: 1px solid var(--primary);
        }

        .result-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .result-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .result-value.success {
            color: var(--success);
        }

        .result-value.primary {
            color: var(--primary);
        }

        /* Container do Gráfico */
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        /* Scrollbar estilizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <div class="header-title">
        <h1>📈 Ganho Garantido Pro</h1>
        <p>Simulação avançada de projeção patrimonial e juros compostos.</p>
    </div>

    <!-- Painel Lateral de Controles -->
    <div class="card controls">
        <div class="input-group">
            <label for="aporte">Aporte Mensal</label>
            <div class="input-wrapper">
                <span class="prefix">R$</span>
                <input type="number" id="aporte" value="500" min="1" step="50">
            </div>
        </div>

        <div class="input-group">
            <label for="taxa">Rentabilidade Anual</label>
            <div class="input-wrapper">
                <span class="prefix">%</span>
                <input type="number" id="taxa" value="10.5" min="0.1" step="0.1">
            </div>
        </div>

        <div class="input-group">
            <label>Horizonte de Investimento</label>
            <div class="years-presets">
                <button class="btn-preset" onclick="setAnos(10, this)">10 Anos</button>
                <button class="btn-preset active" onclick="setAnos(20, this)">20 Anos</button>
                <button class="btn-preset" onclick="setAnos(30, this)">30 Anos</button>
            </div>
            <div class="input-wrapper">
                <input type="number" id="anos" class="no-prefix" value="20" min="1" max="50" oninput="limparPresets()">
            </div>
        </div>

        <button class="btn-main" onclick="calcularJuros()">Calcular Projeção</button>
    </div>

    <!-- Painel Principal de Resultados -->
    <div class="card results">
        
        <div class="results-grid">
            <div class="result-box">
                <div class="result-title">Valor Investido (Bolso)</div>
                <div class="result-value" id="totalInvestido">R$ 0,00</div>
            </div>
            <div class="result-box">
                <div class="result-title">Rendimento (Juros)</div>
                <div class="result-value success" id="totalLucro">R$ 0,00</div>
            </div>
            <div class="result-box highlight">
                <div class="result-title">Patrimônio Acumulado</div>
                <div class="result-value primary" id="saldoFinal">R$ 0,00</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="graficoProjecao"></canvas>
        </div>
    </div>

</div>

<script>
    let meuGrafico = null;
    
    Chart.defaults.color = '#a8a8b3';
    Chart.defaults.font.family = "'Inter', sans-serif";

    function setAnos(valor, botao) {
        document.getElementById('anos').value = valor;
        const botoes = document.querySelectorAll('.btn-preset');
        botoes.forEach(b => b.classList.remove('active'));
        botao.classList.add('active');
        calcularJuros();
    }

    function limparPresets() {
        const botoes = document.querySelectorAll('.btn-preset');
        botoes.forEach(b => b.classList.remove('active'));
    }

    const formatarMoeda = (valor) => {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    function calcularJuros() {
        const aporteMensal = parseFloat(document.getElementById('aporte').value) || 0;
        const taxaAnual = (parseFloat(document.getElementById('taxa').value) || 0) / 100;
        const anos = parseInt(document.getElementById('anos').value) || 1;
        
        const taxaMensal = Math.pow(1 + taxaAnual, 1 / 12) - 1;
        
        let saldoAcumulado = 0;
        let totalInvestido = 0;
        
        // Arrays para alimentar o gráfico
        let historicoAnos = [];
        let dadosInvestido = [];
        let dadosJuros = [];
        
        for (let ano = 1; ano <= anos; ano++) {
            for (let mes = 1; mes <= 12; mes++) {
                let rendimento = saldoAcumulado * taxaMensal;
                saldoAcumulado += aporteMensal + rendimento;
                totalInvestido += aporteMensal;
            }
            
            // Salva o "fotografia" do patrimônio ao final de cada ano
            historicoAnos.push(ano + 'º Ano');
            dadosInvestido.push(totalInvestido);
            dadosJuros.push(saldoAcumulado - totalInvestido);
        }
        
        const lucroPuro = saldoAcumulado - totalInvestido;
        
        // Atualiza UI textual
        document.getElementById('totalInvestido').innerText = formatarMoeda(totalInvestido);
        document.getElementById('totalLucro').innerText = formatarMoeda(lucroPuro);
        document.getElementById('saldoFinal').innerText = formatarMoeda(saldoAcumulado);
        
        // Atualiza Gráfico
        atualizarGrafico(historicoAnos, dadosInvestido, dadosJuros);
    }

    function atualizarGrafico(labels, investido, juros) {
        const ctx = document.getElementById('graficoProjecao').getContext('2d');
        
        if (meuGrafico) {
            meuGrafico.destroy();
        }
        
        meuGrafico = new Chart(ctx, {
            type: 'line', // Usando gráfico de linha empilhada (Área) para visual mais financeiro
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Valor Investido',
                        data: investido,
                        borderColor: '#820ad1',
                        backgroundColor: 'rgba(130, 10, 209, 0.4)', // Roxo Nubank transparente
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHitRadius: 10
                    },
                    {
                        label: 'Juros Acumulados',
                        data: juros,
                        borderColor: '#04d361',
                        backgroundColor: 'rgba(4, 211, 97, 0.4)', // Verde Neon transparente
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHitRadius: 10
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            usePointStyle: true,
                            boxWidth: 8
                        }
                    },
                    tooltip: {
                        backgroundColor: '#202024',
                        titleColor: '#e1e1e6',
                        bodyColor: '#e1e1e6',
                        borderColor: '#323238',
                        borderWidth: 1,
                        padding: 12,
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + formatarMoeda(context.raw);
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false,
                            drawBorder: false
                        }
                    },
                    y: {
                        stacked: true, // Empilha os valores para mostrar o patrimônio total
                        grid: {
                            color: '#323238',
                            drawBorder: false
                        },
                        ticks: {
                            callback: function(value) {
                                if (value >= 1000000) return 'R$ ' + (value / 1000000).toFixed(1) + 'M';
                                if (value >= 1000) return 'R$ ' + (value / 1000).toFixed(0) + 'k';
                                return 'R$ ' + value;
                            }
                        }
                    }
                }
            }
        });
    }
    
    // Inicia a primeira simulação ao carregar
    window.onload = calcularJuros;
</script>

</body>
</html>
